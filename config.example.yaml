# Все значения необязательны. Секреты следует передавать через переменные окружения
# или закрытые файлы токенов (с правами 0600), но никогда не хранить в этом файле.
# Локальный резервный путь для ключа OpenAI:
# .access/.openai_access_token.txt
home:
  seasons: {spring: "03-01", summer: "06-01", autumn: "09-01", winter: "12-01"}
  # Резерв: основной часовой пояс берётся из настроек устройства ZONT.
  timezone: Europe/Samara

preferences:
  objective: neutral
  comfort_band_c: 0.5
  # target_temperature_c: 22.0
  quiet_hours:
    from: "23:00"
    to: "08:00"

analysis:
  daily_ai_when_normal: false
  max_recommendations_per_report: 3
  default_experiment_days: 7
  minimum_quality_score: 0.70
  short_cycle_minutes: 5
  # Только при подтверждённой семантике оборудования: fl=1 и 0% = нижняя точка
  # шкалы активного горения. Не определяет кВт; для других адаптеров оставьте unknown.
  modulation_capability_profile: unknown # unknown | flame_zero_is_minimum

# Есть ли у бойлера косвенного нагрева контур рециркуляции ГВС. Наличие датчика насоса
# не предполагается: возможная работа насоса осторожно определяется по изменению температуры.
dhw:
  recirculation_present: true

openai:
  enabled: false
  daily_model: gpt-5.6-luna
  review_model: gpt-5.6-terra
  reasoning_effort: medium
  prompt_version: analyst-v2
  monthly_token_budget: 100000

notifications:
  log:
    enabled: true
  telegram:
    enabled: false

storage:
  backend: sqlite
  path: zont-analyzer.sqlite3
  backup_dir: backups

# Относительные пути разрешаются внутри ZONT_ANALYZER_DATA_DIR. Абсолютные пути поддерживаются
# для подключённого каталога публикации; зависящие от окружения веб-пути здесь не задаются.
pilot:
  reports_dir: reports
  worker_status_file: worker-status.json
  max_catchup_days: 90

# Worker принимает только feedback к существующим рекомендациям. Endpoint слушает
# loopback; внешний reverse proxy должен закрывать весь публичный периметр Basic Auth.
feedback:
  enabled: true
  listen_host: 127.0.0.1
  listen_port: 8787
  public_api_base_url: /api

# Обычно контрольный датчик определяется из связи контура в ZONT. Если пользователь
# вручную сменил смысл датчика или хочет временно назначить резервный, можно явно
# переопределить роль температурного ряда по стабильному entity ID. Для составного
# радиодатчика эта температурная роль не применяется к humidity/battery/dbm/flags.
entity_overrides: {}
# entity_overrides:
#   "zont:100001:z3k_radio_sensor:30001":
#     role: control_indoor_temperature
#     display_name: Жилая комната
#   "zont:100001:z3k_temperature:30003":
#     role: technical_temperature
#     display_name: Техническое помещение
