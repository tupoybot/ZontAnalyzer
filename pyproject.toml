[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "zont-analyzer"
version = "0.1.0"
description = "Read-only ZONT telemetry collector and heating analyst"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "openai>=1.68,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "PyYAML>=6,<7",
  "SQLAlchemy>=2.0,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
zont-analyzer = "zont_analyzer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zont_analyzer"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "zont_analyzer/_migrations"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["zont_analyzer"]
