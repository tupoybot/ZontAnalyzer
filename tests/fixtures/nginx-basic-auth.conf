server {
    listen 18086;
    server_name localhost;
    root /srv/www;
    index index.html;

    include /etc/nginx/snippets/zont-analyzer.conf;

    location / {
        return 404;
    }
}

server {
    listen 127.0.0.1:8787;
    server_name feedback-loopback;

    location / {
        default_type application/json;
        return 200 '{"ok":true}';
    }
}
