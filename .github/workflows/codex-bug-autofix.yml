name: Dispatch my issues to Codex Cloud

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing GitHub issue number to dispatch
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: codex-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.user.login == 'tupoybot' &&
        (
          (
            github.event.action == 'opened' &&
            (
              contains(github.event.issue.labels.*.name, 'bug') ||
              contains(github.event.issue.labels.*.name, 'feature') ||
              contains(github.event.issue.labels.*.name, 'enhancement') ||
              contains(github.event.issue.labels.*.name, 'maintenance')
            )
          ) ||
          (
            github.event.action == 'labeled' &&
            (
              github.event.label.name == 'bug' ||
              github.event.label.name == 'feature' ||
              github.event.label.name == 'enhancement' ||
              github.event.label.name == 'maintenance'
            )
          )
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Create Codex work PR and dispatch cloud task
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CODEX_GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.issue_number)
              : context.payload.issue.number;

            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed('issue_number must be a positive integer.');
              return;
            }

            const branch = `codex/issue-${issueNumber}`;
            const dispatchFile = `.codex/dispatch/issue-${issueNumber}.md`;

            if (!process.env.CODEX_GITHUB_TOKEN_PRESENT) {
              core.setFailed(
                'Missing repository secret CODEX_GITHUB_TOKEN. ' +
                'Use a fine-grained PAT owned by tupoybot with Contents, Pull requests, and Issues read/write.'
              );
              return;
            }

            const { data: currentIssue } = await github.rest.issues.get({
              owner, repo, issue_number: issueNumber,
            });
            const labels = currentIssue.labels.map((label) =>
              typeof label === 'string' ? label : label.name
            );

            if (currentIssue.pull_request) {
              core.setFailed(`#${issueNumber} is a pull request, not an issue.`);
              return;
            }

            if (currentIssue.user?.login !== 'tupoybot') {
              core.setFailed(
                `Issue #${issueNumber} does not match dispatch policy: author must be tupoybot.`
              );
              return;
            }

            const matchedKinds = [
              labels.includes('bug') ? 'bug' : null,
              (labels.includes('feature') || labels.includes('enhancement')) ? 'feature' : null,
              labels.includes('maintenance') ? 'maintenance' : null,
            ].filter(Boolean);

            if (matchedKinds.length === 0) {
              core.setFailed(
                `Issue #${issueNumber} does not match dispatch policy: one of labels bug, feature/enhancement, maintenance must be present.`
              );
              return;
            }

            if (matchedKinds.length > 1) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: [
                  '🤖 Codex не запущен: у задачи одновременно указано несколько типов.',
                  '',
                  `Найдены: ${matchedKinds.join(', ')}.`,
                  'Оставьте ровно один тип: `bug`, `feature`/\`enhancement\` или `maintenance`.',
                ].join('\n'),
              });
              core.notice(
                `Issue #${issueNumber} has ambiguous task type labels: ${matchedKinds.join(', ')}`
              );
              return;
            }

            const issueKind = matchedKinds[0];
            const issueKindTitle = {
              bug: 'Bug',
              feature: 'Feature',
              maintenance: 'Maintenance',
            }[issueKind];
            const marker = `<!-- codex-issue-dispatch:${issueNumber}:${issueKind} -->`;
            const anyTypedMarkerPrefix = `<!-- codex-issue-dispatch:${issueNumber}:`;
            const legacyGenericMarker = `<!-- codex-issue-dispatch:${issueNumber} -->`;
            const legacyBugMarker = `<!-- codex-bug-autofix:${issueNumber} -->`;

            // Automatic issue events are idempotent. Manual workflow_dispatch is an explicit retry:
            // it reuses the existing work PR and posts a fresh @codex task comment.
            const issueComments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100,
            });
            const alreadyDispatched = issueComments.some((comment) =>
              comment.body?.includes(marker) ||
              (issueKind === 'bug' && comment.body?.includes(legacyBugMarker))
            );
            const manualRetry = context.eventName === 'workflow_dispatch';
            if (alreadyDispatched && !manualRetry) {
              core.info('Codex already dispatched for this issue.');
              return;
            }

            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const baseBranch = repository.default_branch;
            const { data: base } = await github.rest.repos.getBranch({
              owner, repo, branch: baseBranch,
            });

            let branchExists = true;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            } catch (error) {
              if (error.status !== 404) throw error;
              branchExists = false;
            }

            if (!branchExists) {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: base.commit.sha,
              });
            }

            const body = currentIssue.body?.trim() || '_Описание отсутствует._';
            const trustedComments = issueComments
              .filter((comment) =>
                comment.user?.login === 'tupoybot' &&
                !comment.body?.includes(anyTypedMarkerPrefix) &&
                !comment.body?.includes(legacyGenericMarker) &&
                !comment.body?.includes(legacyBugMarker)
              )
              .map((comment) => comment.body?.trim())
              .filter(Boolean);

            const issueSnapshot = [
              `# ${issueKindTitle} #${issueNumber}: ${currentIssue.title}`,
              '',
              `Source: ${currentIssue.html_url}`,
              `Author: @${currentIssue.user.login}`,
              `Type: ${issueKind}`,
              `Target branch: ${branch}`,
              'Agent policy: .github/codex/issue-agent.md',
              '',
              '## Issue body',
              '',
              body,
              ...(trustedComments.length
                ? [
                    '',
                    '## Additional requirements from issue comments',
                    '',
                    ...trustedComments.flatMap((comment, index) => [
                      `### Comment ${index + 1}`,
                      '',
                      comment,
                      '',
                    ]),
                  ]
                : []),
              '',
              '---',
              '',
              'This file is an automation handoff artifact. Remove it before the task is complete.',
              '',
            ].join('\n');

            let existingDispatchFile = null;
            try {
              const response = await github.rest.repos.getContent({
                owner, repo, path: dispatchFile, ref: branch,
              });
              if (!Array.isArray(response.data)) {
                existingDispatchFile = response.data;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const encodedSnapshot = Buffer.from(issueSnapshot, 'utf8').toString('base64');
            if (!existingDispatchFile) {
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path: dispatchFile,
                branch,
                message: `chore: dispatch ${issueKind} #${issueNumber} to Codex`,
                content: encodedSnapshot,
              });
            } else {
              const existingSnapshot = Buffer.from(
                (existingDispatchFile.content || '').replace(/\n/g, ''),
                'base64'
              ).toString('utf8');
              if (existingSnapshot !== issueSnapshot) {
                await github.rest.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path: dispatchFile,
                  branch,
                  message: `chore: refresh ${issueKind} #${issueNumber} context for Codex`,
                  content: encodedSnapshot,
                  sha: existingDispatchFile.sha,
                });
              }
            }

            const existingPulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'all',
              head: `${owner}:${branch}`,
              base: baseBranch,
              per_page: 10,
            });

            let pr = existingPulls.data.find((item) => item.state === 'open');
            const prTitle = {
              bug: `Codex: fix #${issueNumber} — ${currentIssue.title}`,
              feature: `Codex: implement #${issueNumber} — ${currentIssue.title}`,
              maintenance: `Codex: maintain #${issueNumber} — ${currentIssue.title}`,
            }[issueKind];
            const prBody = [
              `Automated Codex Cloud work PR for #${issueNumber}.`,
              '',
              `Issue: ${currentIssue.html_url}`,
              `Type: ${issueKind}`,
              '',
              'This PR is created only as a GitHub context/branch for Codex Cloud.',
              'Human review is required before merge.',
            ].join('\n');

            // Old work PRs may predate the current Codex Cloud setup. Refresh only
            // automation support files, and only while the PR still has no real work.
            // This avoids the old updateBranch behavior that merged unrelated main
            // changes into a task branch and made them look like Codex output.
            if (pr) {
              const currentPrFiles = await github.paginate(github.rest.pulls.listFiles, {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100,
              });
              const hasRealWork = currentPrFiles.some(
                (file) => !file.filename.startsWith('.codex/dispatch/')
              );

              if (!hasRealWork) {
                const supportFiles = [
                  'AGENTS.md',
                  '.github/codex/issue-agent.md',
                  'deploy/setup-codex-cloud.sh',
                ];

                for (const supportPath of supportFiles) {
                  const baseFile = await github.rest.repos.getContent({
                    owner,
                    repo,
                    path: supportPath,
                    ref: baseBranch,
                  });
                  if (Array.isArray(baseFile.data)) {
                    throw new Error(`Expected file at ${supportPath}, got directory.`);
                  }

                  let branchFile = null;
                  try {
                    const response = await github.rest.repos.getContent({
                      owner,
                      repo,
                      path: supportPath,
                      ref: branch,
                    });
                    if (!Array.isArray(response.data)) branchFile = response.data;
                  } catch (error) {
                    if (error.status !== 404) throw error;
                  }

                  if (branchFile?.sha === baseFile.data.sha) continue;

                  await github.rest.repos.createOrUpdateFileContents({
                    owner,
                    repo,
                    path: supportPath,
                    branch,
                    message: `chore: refresh Codex Cloud support for #${issueNumber}`,
                    content: (baseFile.data.content || '').replace(/\n/g, ''),
                    ...(branchFile ? { sha: branchFile.sha } : {}),
                  });
                  core.info(`Refreshed ${supportPath} on ${branch}.`);
                }
              }
            }

            if (pr) {
              const updated = await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                title: prTitle,
                body: prBody,
              });
              pr = updated.data;
            } else {
              const created = await github.rest.pulls.create({
                owner,
                repo,
                head: branch,
                base: baseBranch,
                draft: true,
                title: prTitle,
                body: prBody,
              });
              pr = created.data;
            }

            const codexPrompt = [
              `@codex Выполни задачу #${issueNumber}: ${currentIssue.title}`,
              '',
              `Тип: ${issueKind}. Полный контекст — \`${dispatchFile}\`.`,
              'Сначала прочитай `AGENTS.md` и `.github/codex/issue-agent.md`, затем dispatch-файл.',
              `Работай в этом draft PR и опубликуй итог именно в \`${branch}\`. Новый PR не создавай.`,
              'Если изменения не удалось запушить и проверить на GitHub, сообщи об этом явно вместо сообщения об успешном завершении.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body: codexPrompt,
            });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: [
                marker,
                manualRetry
                  ? `🔁 Codex Cloud re-dispatched: #${pr.number}`
                  : `🤖 Codex Cloud dispatched: #${pr.number}`,
                pr.html_url,
              ].join('\n'),
            });

            core.notice(
              `Dispatched ${issueKind} issue #${issueNumber} to Codex via PR #${pr.number}`
            );
        env:
          CODEX_GITHUB_TOKEN_PRESENT: ${{ secrets.CODEX_GITHUB_TOKEN != '' }}


  publish_guard:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.user.login, 'chatgpt-codex-connector')
    runs-on: ubuntu-latest
    steps:
      - name: Verify Codex published work to the existing PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CODEX_GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.issue.number;
            const botComment = context.payload.comment.body || '';

            if (!botComment.includes('View task')) {
              core.info('Codex comment is not a final task summary.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (!pr.head?.ref?.startsWith('codex/issue-')) {
              core.info('Not an automated Codex issue PR.');
              return;
            }

            const issueNumber = Number(pr.head.ref.replace('codex/issue-', ''));
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.warning('Could not derive source issue from head branch ' + pr.head.ref + '.');
              return;
            }

            const sourceComments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const triageStopped = sourceComments.some((comment) => {
              if (!comment.user?.login?.startsWith('chatgpt-codex-connector')) return false;
              const body = comment.body || '';
              return (
                body.includes('Тип задачи указан неверно') ||
                body.includes('Поменяйте label') ||
                (body.includes('не удалось') && body.toLowerCase().includes('тип'))
              );
            });

            if (triageStopped) {
              core.info('Codex intentionally stopped at task-type triage.');
              return;
            }

            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const realFiles = changedFiles.filter(
              (file) => !file.filename.startsWith('.codex/dispatch/')
            );
            const dispatchFiles = changedFiles.filter(
              (file) => file.filename.startsWith('.codex/dispatch/')
            );

            if (realFiles.length > 0) {
              core.notice(
                'Codex work is visible in PR #' + prNumber + ': ' +
                realFiles.length + ' non-dispatch file(s), head ' + pr.head.sha + '.'
              );

              for (const file of dispatchFiles) {
                try {
                  const response = await github.rest.repos.getContent({
                    owner,
                    repo,
                    path: file.filename,
                    ref: pr.head.ref,
                  });
                  if (!Array.isArray(response.data)) {
                    await github.rest.repos.deleteFile({
                      owner,
                      repo,
                      path: file.filename,
                      branch: pr.head.ref,
                      sha: response.data.sha,
                      message: 'chore: remove Codex dispatch artifact for #' + issueNumber,
                    });
                    core.info('Removed stale dispatch artifact ' + file.filename + '.');
                  }
                } catch (error) {
                  core.warning(
                    'Could not remove dispatch artifact ' + file.filename + ': ' + error.message
                  );
                }
              }
              return;
            }

            const prComments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const failedMarker = '<!-- codex-publish-failed -->';
            const alreadyFailed = prComments.some(
              (comment) => comment.body?.includes(failedMarker)
            );

            if (!alreadyFailed) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: [
                  failedMarker,
                  '⚠️ Codex Cloud сообщил о завершении, но GitHub не видит реальных изменений в этом PR.',
                  '',
                  'Текущий head: ' + pr.head.ref + ' @ ' + pr.head.sha + '.',
                  'Задача не считается успешно опубликованной.',
                  '',
                  'Проверь Codex Environment: secret GITHUB_TOKEN, доступ к github.com/api.github.com и настройку origin. После исправления перезапусти issue через workflow_dispatch.',
                ].join('\n'),
              });
            }

            core.setFailed(
              'Codex work was not published to PR #' + prNumber + '.'
            );
