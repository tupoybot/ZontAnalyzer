name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src/zont_analyzer
      - run: pytest --cov=zont_analyzer --cov-report=term-missing
      - run: python -m build --wheel
      - run: pip install --force-reinstall --no-deps dist/*.whl
      - run: python -c "from zont_analyzer.cli import app; from zont_analyzer.reports import render_html"
      - run: zont-analyzer --data-dir "$(mktemp -d)" init
      - run: docker build -t zont-analyzer:test .
      - run: docker build --target test -t zont-analyzer:feedback-e2e .
      - run: docker run --rm zont-analyzer:feedback-e2e
      - run: ZONT_ANALYZER_ENV_FILE="$GITHUB_WORKSPACE/deploy/env.example" docker compose -f deploy/compose.yaml -f deploy/compose.test.yaml config
