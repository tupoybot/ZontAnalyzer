name: CI

on:
  pull_request:
    paths-ignore:
      - ".codex/dispatch/**"
  workflow_call:
    inputs:
      build_release_candidate:
        type: boolean
        default: false

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build test environment
        run: deploy/check-local.sh build
      - name: Export identical benchmark environment
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-benchmark')
        run: docker save zont-analyzer:test-local | gzip -1 > "$RUNNER_TEMP/ci-test-image.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci-benchmark')
        with:
          name: ci-test-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-test-image.tar.gz
          retention-days: 7
          compression-level: 0
      - name: Check source in the measured environment
        env:
          ZONT_METRICS_DIR: ${{ runner.temp }}/ci-metrics
        run: deploy/check-local.sh check-prebuilt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-metrics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-metrics
          retention-days: 14
      - run: docker build --target cli -t zont-analyzer:test .
      - run: sh tests/integration/test_nginx_basic_auth.sh
      - run: docker tag zont-analyzer:test zont-analyzer:stage18-candidate
      - run: npm ci --prefix tests/integration/browser
      - run: npx --prefix tests/integration/browser playwright install --with-deps chromium
      - run: sh tests/integration/test_archive_browser.sh
      - run: sh tests/integration/test_cloud_browser.sh
      - run: ZONT_ANALYZER_ENV_FILE="$GITHUB_WORKSPACE/deploy/env.example" docker compose -f deploy/compose.yaml -f deploy/compose.test.yaml config --quiet
      - run: docker compose -f deploy/compose.local.yaml config --quiet
      # Build from the package layer used by the tested image on this runner.
      - name: Build and smoke the cloud candidate
        env:
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          tag="$image:cloud-sha-$COMMIT"
          docker build --target production --provenance=false --build-arg "REVISION=$COMMIT" \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$COMMIT" -t "$tag" .
          test "$(docker image inspect "$tag" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$COMMIT"
          test "$(docker image inspect "$tag" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "https://github.com/$REPOSITORY"
          test "$(docker image inspect "$tag" --format '{{index .Config.Labels "org.zont.runtime"}}')" = cloud
          deploy/smoke-cloud-local.sh "$tag"
      - name: Export tested cloud candidate for this release run
        if: inputs.build_release_candidate
        env:
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          image="ghcr.io/${REPOSITORY,,}"
          docker save "$image:cloud-sha-$COMMIT" | gzip -1 > application-candidate.tar.gz
          sha256sum application-candidate.tar.gz > application-candidate.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.build_release_candidate
        with:
          name: application-candidate
          path: |
            ${{ runner.temp }}/application-candidate.tar.gz
            ${{ runner.temp }}/application-candidate.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          overwrite: true
