name: CI

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - ".codex/dispatch/**"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build test environment
        run: deploy/check-local.sh build
      - name: Export identical benchmark environment
        if: github.head_ref == 'stage9/ci-optimization'
        run: docker save zont-analyzer:test-local | gzip -1 > "$RUNNER_TEMP/ci-test-image.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.head_ref == 'stage9/ci-optimization'
        with:
          name: ci-test-image
          path: ${{ runner.temp }}/ci-test-image.tar.gz
          retention-days: 7
          compression-level: 0
      - name: Check source in the measured environment
        env:
          ZONT_METRICS_DIR: ${{ runner.temp }}/ci-metrics
        run: deploy/check-local.sh check-prebuilt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-metrics
          path: ${{ runner.temp }}/ci-metrics
          retention-days: 14
      - run: docker build --target cli -t zont-analyzer:test .
      - run: sh tests/integration/test_nginx_basic_auth.sh
      - run: docker tag zont-analyzer:test zont-analyzer:stage18-candidate
      - run: npm ci --prefix tests/integration/browser
      - run: npx --prefix tests/integration/browser playwright install --with-deps chromium
      - run: sh tests/integration/test_archive_browser.sh
      - run: ZONT_ANALYZER_ENV_FILE="$GITHUB_WORKSPACE/deploy/env.example" docker compose -f deploy/compose.yaml -f deploy/compose.test.yaml config --quiet
      - run: docker compose -f deploy/compose.local.yaml config --quiet
