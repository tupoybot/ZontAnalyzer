name: CI

on:
  push:
    branches: ['**']
    tags: ['release-*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested commit to GHCR (does not deploy)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy src/zont_analyzer
      - run: pytest --cov=zont_analyzer --cov-report=term-missing
      - run: python -m build --wheel
      - run: pip install --force-reinstall --no-deps dist/*.whl
      - run: python -c "from zont_analyzer.cli import app; from zont_analyzer.reports import render_html"
      - run: zont-analyzer --data-dir "$(mktemp -d)" init
      - run: docker build -t zont-analyzer:test .
      - run: docker build --target test -t zont-analyzer:feedback-e2e .
      - run: docker run --rm zont-analyzer:feedback-e2e
      - run: sh tests/integration/test_nginx_basic_auth.sh
      - run: ZONT_ANALYZER_ENV_FILE="$GITHUB_WORKSPACE/deploy/env.example" docker compose -f deploy/compose.yaml -f deploy/compose.test.yaml config --quiet
      - run: docker compose -f deploy/compose.local.yaml config --quiet

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/release-') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish commit image and record deployment digest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          tag="$image:sha-$COMMIT"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          if docker manifest inspect "$tag" >/dev/null 2>&1; then
            docker pull "$tag"
          else
            docker build --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
              --label "org.opencontainers.image.revision=$COMMIT" -t "$tag" .
            docker push "$tag"
          fi
          digest=$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')
          printf 'ZONT_ANALYZER_IMAGE=%s\n' "$digest" > image.env
          printf '### Image ready\n\n`%s`\n\nDeploy explicitly using `deploy/release.sh`.\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: image-reference
          path: image.env
