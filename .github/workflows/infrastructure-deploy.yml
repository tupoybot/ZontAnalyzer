name: Deploy isolated cloud infrastructure

on:
  push:
    branches: ['stageM1/cloud-foundation', 'architecture/cloud-first-serverless']
    paths: ['infra/**', '.github/workflows/infrastructure-deploy.yml']
  workflow_dispatch:
    inputs:
      application_image:
        description: Accepted GHCR application image with sha256 digest
        type: string
        required: true
      apply:
        description: Apply the reviewed infrastructure configuration
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloud-dev-terraform
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/architecture/cloud-first-serverless' || github.ref == 'refs/heads/stageM1/cloud-foundation'
    runs-on: ubuntu-latest
    environment: cloud-dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Prepare private environment configuration
        id: configuration
        env:
          SCOPE: ${{ secrets.M1_SCOPE_JSON }}
          CONFIG: ${{ secrets.M1_CONFIG_JSON }}
          BACKEND: ${{ secrets.M1_BACKEND_JSON }}
          STATE_ACCESS_KEY: ${{ secrets.M1_STATE_ACCESS_KEY }}
          STATE_SECRET_KEY: ${{ secrets.M1_STATE_SECRET_KEY }}
          DEPLOY_SERVICE_ACCOUNT: ${{ secrets.M1_DEPLOY_SERVICE_ACCOUNT }}
          APPLICATION_IMAGE: ${{ inputs.application_image }}
        run: |
          set -euo pipefail
          umask 077
          for name in SCOPE CONFIG BACKEND STATE_ACCESS_KEY STATE_SECRET_KEY DEPLOY_SERVICE_ACCOUNT; do
            if [[ -z "${!name}" ]]; then
              printf '::error::Required cloud-dev Environment Secret is missing (%s).\n' "$name"
              exit 1
            fi
          done
          private="$RUNNER_TEMP/m1"
          mkdir -p "$private/cloud-work"
          printf '%s' "$SCOPE" > "$private/scope.json"
          printf '%s' "$BACKEND" > "$private/cloud.tfbackend.json"
          printf '%s' "$CONFIG" | jq --arg image "$APPLICATION_IMAGE" \
            'if $image != "" then .application_image=$image else . end | .enable_timer=false' > "$private/cloud-work/inputs.tfvars.json"
          printf 'AWS_ACCESS_KEY_ID=%s\nAWS_SECRET_ACCESS_KEY=%s\n' \
            "$STATE_ACCESS_KEY" "$STATE_SECRET_KEY" > "$private/state.env"
          docker build -t zont-m1-tools:local infra/tools
          docker run --rm --network none \
            --mount "type=bind,src=$PWD/infra/scripts,dst=/scripts,readonly" \
            --mount "type=bind,src=$private,dst=/private,readonly" \
            zont-m1-tools:local python /scripts/check-scope.py \
            /private/scope.json /private/cloud-work/inputs.tfvars.json /private/cloud.tfbackend.json
      - name: Exchange the protected GitHub identity
        env:
          DEPLOY_SERVICE_ACCOUNT: ${{ secrets.M1_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/m1"
          test "$DEPLOY_SERVICE_ACCOUNT" = "$(jq -r .allowed_deployment_service_account_id "$private/scope.json")"
          printf 'Authorization: bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" > "$private/oidc-header"
          curl --fail --silent --show-error --max-time 20 --header "@$private/oidc-header" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fiam.api.cloud.yandex.net%2Fiam%2Fv1%2Ftokens" \
            > "$private/oidc.json"
          # The form upload must contain only JWT bytes, without jq's trailing newline.
          jq -ejr '.value | select(type == "string" and length > 0)' "$private/oidc.json" > "$private/oidc-token"
          printf 'GitHub OIDC token acquired.\n'
          node - "$private/oidc-token" <<'JS'
          const fs = require('fs');
          const token = fs.readFileSync(process.argv[2], 'utf8');
          const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url'));
          const [owner, repository] = process.env.GITHUB_REPOSITORY.split('/');
          const expected = {
            iss: 'https://token.actions.githubusercontent.com',
            aud: 'https://iam.api.cloud.yandex.net/iam/v1/tokens',
            sub: `repo:${owner}@${process.env.GITHUB_REPOSITORY_OWNER_ID}/${repository}@${process.env.GITHUB_REPOSITORY_ID}:environment:cloud-dev`,
          };
          for (const [key, value] of Object.entries(expected)) {
            if (claims[key] !== value) {
              console.error(`::error::GitHub OIDC ${key} does not match the configured federation.`);
              process.exit(1);
            }
          }
          console.log('OIDC issuer, audience and subject match the expected configuration.');
          JS
          curl --fail --silent --show-error --max-time 20 \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=$DEPLOY_SERVICE_ACCOUNT" \
            --data-urlencode "subject_token@$private/oidc-token" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token > "$private/exchange.json"
          jq -er .access_token "$private/exchange.json" > "$private/deploy-token"
      - name: Verify and copy the accepted application digest
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/m1"
          APPLICATION_IMAGE=$(jq -er .application_image "$private/cloud-work/inputs.tfvars.json")
          expected="ghcr.io/${GITHUB_REPOSITORY,,}@sha256:"
          [[ "$APPLICATION_IMAGE" == "$expected"* ]]
          digest="${APPLICATION_IMAGE##*@}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s' "$APPLICATION_IMAGE" > "$private/application-source"
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$private,dst=/private" zont-m1-tools:local sh -c '
              set -eu
              source=$(cat /private/application-source)
              skopeo inspect "docker://$source" > /private/application-source-inspect.json
            '
          commit=$(jq -er '.Labels["org.opencontainers.image.revision"]' "$private/application-source-inspect.json")
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$commit" origin/main
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$private,dst=/private" zont-m1-tools:local sh -c '
              set -eu
              source=$(cat /private/application-source)
              registry=$(jq -er .allowed_registry_id /private/scope.json)
              skopeo login --authfile /private/registry-auth.json -u iam \
                --password-stdin cr.yandex < /private/deploy-token > /private/registry-login.log 2>&1
              skopeo copy --all --preserve-digests --dest-authfile /private/registry-auth.json \
                "docker://$source" "docker://cr.yandex/$registry/application:selected" \
                > /private/application-copy.log 2>&1
            '
      - name: Plan infrastructure without publishing its private output
        run: infra/deploy.sh plan "$RUNNER_TEMP/m1"
      - name: Apply the selected artifact and environment
        if: inputs.apply
        run: infra/deploy.sh apply "$RUNNER_TEMP/m1"
      - name: Preserve private deployment evidence
        if: always() && steps.configuration.outcome == 'success'
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/m1"
          test -f "$private/state.env" || exit 0
          docker run --rm --user "$(id -u):$(id -g)" --env-file "$private/state.env" \
            --mount "type=bind,src=$PWD/infra/scripts,dst=/scripts,readonly" \
            --mount "type=bind,src=$private,dst=/private,readonly" \
            -e EVIDENCE_RUN="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" zont-m1-tools:local sh -c '
              set -eu
              python /scripts/check-scope.py /private/scope.json /private/cloud-work/inputs.tfvars.json /private/cloud.tfbackend.json
              python /scripts/archive_evidence.py /private "$EVIDENCE_RUN"
            '
      - name: Safe result summary
        run: printf 'Infrastructure workflow succeeded. Evidence is in the encrypted private state bucket. Timer is disabled.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/m1"
