# Temporary publication policy for a static /za site. Keep the selected host
# path out of application code and the reusable base Compose file.
services:
  worker:
    volumes:
      - type: bind
        source: ${ZONT_ANALYZER_PUBLISH_DIR:-/opt/nightscout-compose/certbot/www/tupoybot.ru/html/za}
        target: /publish
        bind:
          create_host_path: false
