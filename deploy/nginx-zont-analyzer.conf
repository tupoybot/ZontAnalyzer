# Include this file inside the TLS server for hk.tupoybot.ru.
# The same Basic Auth perimeter protects static reports, the archive and feedback API.
location ^~ /za/api/ {
    auth_basic "ZontAnalyzer";
    auth_basic_user_file /etc/nginx/zont-analyzer.htpasswd;

    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /za/daily/ {
    auth_basic "ZontAnalyzer";
    auth_basic_user_file /etc/nginx/zont-analyzer.htpasswd;

    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
}

location ^~ /za/ {
    auth_basic "ZontAnalyzer";
    auth_basic_user_file /etc/nginx/zont-analyzer.htpasswd;

    try_files $uri $uri/ =404;
}
