# Include ONLY in the dedicated za.tupoybot.ru server, never in the shared HK vhost.
root /var/www/html/za;
index latest.html;
auth_basic "ZontAnalyzer";
auth_basic_user_file /etc/nginx/zont-analyzer.htpasswd;
add_header Cache-Control "private, no-cache" always;
add_header X-Content-Type-Options nosniff always;

location ^~ /api/ {
    # The loopback application retains its configured legacy path for both sites.
    proxy_pass http://127.0.0.1:8787/za/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /daily/ {
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;
}

location / {
    try_files $uri $uri/ =404;
}

# Atomic-write temporary files and publication locks are never public artifacts.
location ~ /\. {
    deny all;
}
