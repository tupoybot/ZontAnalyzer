# Dedicated vhost on the EXISTING HK TLS fallback listener.
# Port 443 belongs to Xray; do not change Xray, shared HK servers or SNI routing.
server {
    listen 80;
    listen [::]:80;
    server_name za.tupoybot.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://za.tupoybot.ru$request_uri;
    }
}

server {
    listen 127.0.0.1:4443 ssl;
    http2 on;
    server_name za.tupoybot.ru;

    ssl_certificate /etc/letsencrypt/live/za.tupoybot.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/za.tupoybot.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/zont-analyzer-root.conf;
}
