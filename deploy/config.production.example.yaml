home:
  timezone: Europe/Samara

preferences:
  objective: balanced
  comfort_band_c: 0.5

analysis:
  daily_ai_when_normal: false
  max_recommendations_per_report: 3
  minimum_quality_score: 0.70

dhw:
  recirculation_present: true

storage:
  backend: sqlite
  path: zont-analyzer.sqlite3
  backup_dir: backups
  warn_disk_usage_pct: 25

zont:
  base_url: https://my.zont.online/api
  sync_chunk_hours: 24

openai:
  # Enable only after the owner explicitly approves sending the compact fact packet
  # to OpenAI. The test deployment can still publish an already-created AI report.
  enabled: false
  daily_model: gpt-5.6-luna
  review_model: gpt-5.6-terra
  reasoning_effort: medium
  prompt_version: analyst-v2
  monthly_token_budget: 1000000

scheduler:
  sync_every_minutes: 5
  overlap_minutes: 15

pilot:
  reports_dir: /publish
  worker_status_file: worker-status.json
  max_catchup_days: 90

feedback:
  enabled: true
  # Порт контейнера опубликован Compose только на loopback хоста; nginx проксирует /za/api.
  listen_host: 0.0.0.0
  listen_port: 8787
  public_api_base_url: /za/api

notifications:
  log:
    enabled: true
  telegram:
    enabled: false
