# Все поля, кроме credentials через environment, необязательны.
# При отсутствии значения ZontAnalyzer сначала пытается получить его из ZONT,
# затем использует безопасный default. Этот файл содержит только overrides.

home:
  # Обычно определяется из окружения сервера/настроек приложения.
  timezone: Europe/Samara

preferences:
  # neutral = сохранить текущий комфорт и устранять явные аномалии.
  # Возможные будущие значения: comfort, balanced, economy.
  objective: neutral

  # Если не задано, используется диапазон, выведенный из настроек зон ZONT.
  # comfort_band_c: 0.5

  # Необязательные границы времени, когда допустимы обычные уведомления.
  quiet_hours:
    from: "23:00"
    to: "08:00"

analysis:
  daily_ai_when_normal: false
  max_recommendations_per_report: 3
  default_experiment_days: 7

safety:
  # Дополнительные личные ограничения поверх встроенной неизменяемой policy.
  never_suggest_categories: []
  # Пример:
  # never_suggest_categories:
  #   - boiler_service_parameters

notifications:
  log:
    enabled: true
  telegram:
    enabled: false
    # Token задаётся только переменной TELEGRAM_BOT_TOKEN.
    # chat_id появляется после безопасной pairing-команды.
    # chat_id: 123456789
    severity_at_least: info
    send_weekly_html: true

storage:
  # Сначала используется SQLite. Решение подтверждается benchmark'ом.
  backend: sqlite
  warn_disk_usage_pct: 25

# Если discovery ошибся, точечные исправления задаются по стабильному ZONT ID.
# Они не обязательны и не должны заполняться вручную заранее.
entity_overrides: {}
# entity_overrides:
#   "zont:device-123:sensor-456":
#     role: outdoor_temperature
#     display_name: Уличный датчик на северной стене
